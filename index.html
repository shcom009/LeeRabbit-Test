<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbdde5">
<title>이토끼 게임 시리즈</title>
<meta name="description" content="이토끼 룰렛과 퍼즐 맞추기를 즐겨보세요.">
<link rel="icon" href="rabbit_female_icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fce8ed;font-family:Arial,"Noto Sans KR",sans-serif}body{display:flex;justify-content:center}.screen{position:relative;width:min(100vw,430px);min-height:100vh;background:#fce8ed;overflow:hidden}.art{display:block;width:100%;height:auto}.hotspot{position:absolute;display:block;z-index:4;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.hotspot:focus-visible{outline:3px solid #ff4d82;outline-offset:2px;border-radius:14px}.roulette{left:65.2%;top:42.15%;width:24.8%;height:4.75%}.puzzle{left:65.2%;top:61.15%;width:24.8%;height:4.75%}.rewards{left:6.8%;top:89.0%;width:26.5%;height:7.3%}.sound{left:37.7%;top:89.0%;width:26.5%;height:7.3%}.loader{position:absolute;inset:0;display:grid;place-items:center;background:#fce8ed;color:#d84b70;font-weight:800;z-index:10}.loader.hide{display:none}.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(73,30,42,.42)}.modal.show{display:flex}.panel{width:min(90vw,380px);background:#fff8fa;border:2px solid #ffc7d5;border-radius:24px;padding:20px;box-shadow:0 18px 50px rgba(90,35,50,.25);color:#6a3441}.panel h2{margin:0 0 15px;text-align:center;color:#e94972;font-size:24px}.empty{padding:22px 12px;text-align:center;background:#fff0f4;border-radius:16px;line-height:1.6}.reward-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid #f2d8df}.count{font-weight:900;color:#e94770}.close{width:100%;margin-top:16px;padding:12px;border:0;border-radius:14px;background:#f65f87;color:#fff;font-size:16px;font-weight:900}.toast{position:fixed;left:50%;bottom:24px;z-index:40;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:rgba(85,35,49,.9);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main class="screen" id="screen" aria-label="이토끼 게임 시리즈 게임 목록">
  <div class="loader" id="loader">게임 화면을 불러오는 중… 🐰</div>
  <img id="menuArt" class="art" alt="이토끼 게임 시리즈. 이토끼 룰렛과 퍼즐 맞추기 게임 목록">
  <a class="hotspot roulette" href="https://shcom009.github.io/LeeRabbit/" aria-label="이토끼 룰렛 시작" title="이토끼 룰렛 시작">이토끼 룰렛 시작</a>
  <a class="hotspot puzzle" href="puzzle.html" aria-label="퍼즐 맞추기 시작" title="퍼즐 맞추기 시작">퍼즐 맞추기 시작</a>
  <button class="hotspot rewards" id="rewardBtn" aria-label="내 보상함 열기" title="내 보상함">내 보상함</button>
  <button class="hotspot sound" id="soundBtn" aria-label="소리 켜기 또는 끄기" title="소리 ON/OFF">소리</button>
</main>
<div class="modal" id="rewardModal" role="dialog" aria-modal="true" aria-labelledby="rewardTitle"><div class="panel"><h2 id="rewardTitle">🎁 내 보상함</h2><div id="rewardBody"></div><button class="close" id="closeReward">닫기</button></div></div>
<div class="toast" id="toast"></div>
<script>
const CHUNKS=7, KEY_REWARDS='leerabbitRewards', KEY_SOUND='leerabbitSound';
async function loadArt(){try{const parts=await Promise.all(Array.from({length:CHUNKS},(_,i)=>fetch(`assets/menu${i}.txt?v=3`).then(r=>{if(!r.ok)throw new Error('asset');return r.text()})));document.getElementById('menuArt').src='data:image/webp;base64,'+parts.join('');document.getElementById('menuArt').onload=()=>document.getElementById('loader').classList.add('hide')}catch(e){document.getElementById('loader').textContent='화면을 불러오지 못했어요. 새로고침해 주세요.'}}
loadArt();
const modal=document.getElementById('rewardModal'), rewardBody=document.getElementById('rewardBody');
function rewards(){try{return JSON.parse(localStorage.getItem(KEY_REWARDS)||'{}')}catch{return {}}}
function renderRewards(){const items=Object.entries(rewards()).filter(([,n])=>Number(n)>0);rewardBody.innerHTML=items.length?items.map(([name,n])=>`<div class="reward-row"><span>${name}</span><span class="count">× ${n}</span></div>`).join(''):'<div class="empty">아직 받은 보상이 없어요.<br>게임을 즐기고 보상을 모아보세요! 🐰</div>'}
document.getElementById('rewardBtn').onclick=()=>{renderRewards();modal.classList.add('show')};document.getElementById('closeReward').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
let sound=localStorage.getItem(KEY_SOUND)!=='off';const toast=document.getElementById('toast');let tt;function showToast(s){toast.textContent=s;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1300)}document.getElementById('soundBtn').onclick=()=>{sound=!sound;localStorage.setItem(KEY_SOUND,sound?'on':'off');showToast(sound?'🔊 소리 ON':'🔇 소리 OFF')};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script>
</body>
</html>
