<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffd9e3"><title>퍼즐 맞추기</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fde9ee;font-family:Arial,"Noto Sans KR",sans-serif}body{display:flex;justify-content:center}.screen{position:relative;width:min(100vw,430px);min-height:100vh;background:#fde9ee;overflow:hidden}.art{display:block;width:100%;height:auto}.hotspot{position:absolute;display:block;z-index:5;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.back{left:4.7%;top:2.0%;width:11.5%;height:5.0%}.gift{right:4.5%;top:2.0%;width:11.5%;height:5.0%}.preview{left:57.5%;top:11.0%;width:23%;height:5.2%}.hint{left:57.5%;top:17.1%;width:23%;height:5.2%}.restart{left:3.7%;top:91.1%;width:32.8%;height:5.2%}.hintBottom{right:3.7%;top:91.1%;width:32.8%;height:5.2%}.hotspot:focus-visible{outline:3px solid #ff4d82;outline-offset:2px;border-radius:14px}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:rgba(77,30,43,.92);color:#fff;padding:11px 18px;border-radius:999px;font-weight:800;z-index:20;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}</style></head><body><main class="screen"><img class="art" src="assets/puzzle-screen.webp?v=1" alt="퍼즐 맞추기 화면"><a class="hotspot back" href="./" aria-label="게임 목록으로">목록</a><button class="hotspot gift" type="button" data-msg="내 보상함은 다음 기능 연결 단계에서 작동해요.">보상함</button><button class="hotspot preview" type="button" data-msg="미리보기 기능은 퍼즐 동작 구현 단계에서 연결해요.">미리보기</button><button class="hotspot hint" type="button" data-msg="힌트 기능은 퍼즐 동작 구현 단계에서 연결해요.">힌트</button><button class="hotspot restart" type="button" data-msg="다시 시작 기능은 퍼즐 동작 구현 단계에서 연결해요.">다시 시작</button><button class="hotspot hintBottom" type="button" data-msg="힌트 기능은 퍼즐 동작 구현 단계에서 연결해요.">힌트</button></main><div class="toast" id="toast"></div><script>const toast=document.getElementById('toast');let timer;document.querySelectorAll('[data-msg]').forEach(b=>b.addEventListener('click',()=>{toast.textContent=b.dataset.msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1600)}));if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
