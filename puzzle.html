<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fde9ee"><title>퍼즐 맞추기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fde9ee;font-family:Arial,"Noto Sans KR",sans-serif}body{display:flex;justify-content:center}.screen{position:relative;width:min(100vw,430px);background:#fde9ee;overflow:hidden}.art{display:block;width:100%;height:auto}.loader{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:#fde9ee;color:#d84b70;font-weight:900;text-align:center;padding:24px}.loader.hide{display:none}.hotspot{position:absolute;display:block;z-index:20;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.back{left:4.7%;top:2%;width:11.5%;height:5%}.gift{right:4.5%;top:2%;width:11.5%;height:5%}.previewBtn{left:57.5%;top:11%;width:23%;height:5.2%}.hintBtn{left:57.5%;top:17.1%;width:23%;height:5.2%}.restartBtn{left:3.7%;top:91.1%;width:32.8%;height:5.2%}.hintBottom{right:3.7%;top:91.1%;width:32.8%;height:5.2%}
#board{position:absolute;left:3.5%;top:24.4%;width:93%;height:32.6%;z-index:8;border-radius:10px;overflow:visible;background:#fff6f3;border:2px solid rgba(156,93,56,.7);box-shadow:0 2px 8px rgba(130,77,55,.16)}#slotGrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);overflow:hidden;border-radius:8px}.slot{border:1px dashed rgba(220,148,160,.42);background:rgba(255,255,255,.55)}#previewOverlay{position:absolute;inset:0;z-index:12;border-radius:8px;background-size:100% 100%;background-repeat:no-repeat;opacity:0;pointer-events:none;transition:opacity .25s}#previewOverlay.show{opacity:1}.piece{position:absolute;z-index:15;touch-action:none;user-select:none;-webkit-user-drag:none;cursor:grab;filter:drop-shadow(0 2px 2px rgba(88,50,40,.25));transition:filter .15s}.piece.dragging{z-index:40;cursor:grabbing;filter:drop-shadow(0 7px 7px rgba(88,50,40,.35));transition:none}.piece.locked{cursor:default;filter:drop-shadow(0 1px 1px rgba(88,50,40,.15))}
#tray{position:absolute;left:4%;right:4%;top:68.1%;height:20.8%;z-index:9;display:grid;grid-template-rows:repeat(2,1fr);grid-auto-flow:column;grid-auto-columns:23%;gap:6px 8px;overflow-x:auto;overflow-y:hidden;padding:7px 4px 9px;scrollbar-width:none;background:rgba(255,245,245,.92);border-radius:14px;border:1px solid rgba(255,182,196,.65)}#tray::-webkit-scrollbar{display:none}.trayCell{position:relative;display:grid;place-items:center;min-width:0}.trayCell .piece{position:relative!important;left:auto!important;top:auto!important;width:92%!important;height:auto!important;max-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:26px;z-index:60;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:rgba(77,30,43,.92);color:#fff;padding:11px 18px;border-radius:999px;font-weight:800;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.status{position:absolute;left:50%;top:63.8%;transform:translateX(-50%);z-index:10;color:#dc4f70;font-weight:900;font-size:13px;background:rgba(255,255,255,.75);padding:4px 10px;border-radius:999px;pointer-events:none}
</style></head>
<body><main class="screen" id="screen"><div class="loader" id="loader">퍼즐을 준비하는 중… 🐰</div><img id="puzzleArt" class="art" alt="퍼즐 맞추기 화면"><a class="hotspot back" href="./" aria-label="게임 목록으로">목록</a><button class="hotspot gift" type="button" data-msg="내 보상함은 완성 단계에서 연결할게요.">보상함</button><button class="hotspot previewBtn" id="previewBtn" type="button" aria-label="미리보기">미리보기</button><button class="hotspot hintBtn" type="button" data-msg="힌트는 다음 단계에서 연결할게요.">힌트</button><button class="hotspot restartBtn" id="restartBtn" type="button" aria-label="다시 시작">다시 시작</button><button class="hotspot hintBottom" type="button" data-msg="힌트는 다음 단계에서 연결할게요.">힌트</button><div id="board"><div id="slotGrid"></div><div id="previewOverlay"></div></div><div class="status" id="status">0 / 20</div><div id="tray"></div></main><div class="toast" id="toast"></div>
<script>
const ROWS=4,COLS=5;let sourceURL='',pieceDefs=[],locked=0,drag=null,audioCtx=null;
const screen=document.getElementById('screen'),board=document.getElementById('board'),tray=document.getElementById('tray'),slotGrid=document.getElementById('slotGrid'),previewOverlay=document.getElementById('previewOverlay'),statusEl=document.getElementById('status'),loader=document.getElementById('loader'),art=document.getElementById('puzzleArt');
function toastMsg(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1500)}
document.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>toastMsg(b.dataset.msg));
function tone(type){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);const now=audioCtx.currentTime;if(type==='move'){o.type='sine';o.frequency.setValueAtTime(260,now);o.frequency.exponentialRampToValueAtTime(170,now+.09);g.gain.setValueAtTime(.035,now);g.gain.exponentialRampToValueAtTime(.001,now+.1);o.start(now);o.stop(now+.1)}else{o.type='triangle';o.frequency.setValueAtTime(520,now);o.frequency.exponentialRampToValueAtTime(760,now+.06);g.gain.setValueAtTime(.055,now);g.gain.exponentialRampToValueAtTime(.001,now+.09);o.start(now);o.stop(now+.09)}}catch(e){}}
async function loadArt(){const names=['pv0.txt','pv1.txt','pv2.txt'];const parts=[];for(const n of names){const r=await fetch('./assets/'+n+'?v=9',{cache:'no-store'});if(!r.ok)throw new Error(n);parts.push((await r.text()).trim())}const b64=parts.join('').replace(/\s/g,''),raw=atob(b64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return URL.createObjectURL(new Blob([bytes],{type:'image/webp'}))}
function jigsawPath(ctx,x,y,w,h,pad,t,r,b,l){const X=x+pad,Y=y+pad,k=.22;ctx.beginPath();ctx.moveTo(X,Y);edgeH(ctx,X,Y,w,t,-1);edgeV(ctx,X+w,Y,h,r,1);edgeH(ctx,X+w,Y+h,-w,b,1);edgeV(ctx,X,Y+h,-h,l,-1);ctx.closePath();function edgeH(c,sx,sy,len,tab,dir){const s=Math.sign(len),L=Math.abs(len),a=L*.34,b=L*.43,c1=L*.57,d=L*.66;c.lineTo(sx+s*a,sy);if(tab){const out=tab*dir*pad*.72;c.bezierCurveTo(sx+s*b,sy,sx+s*b,sy+out,sx+s*L*.5,sy+out);c.bezierCurveTo(sx+s*c1,sy+out,sx+s*c1,sy,sx+s*d,sy)}c.lineTo(sx+len,sy)}function edgeV(c,sx,sy,len,tab,dir){const s=Math.sign(len),L=Math.abs(len),a=L*.34,b=L*.43,c1=L*.57,d=L*.66;c.lineTo(sx,sy+s*a);if(tab){const out=tab*dir*pad*.72;c.bezierCurveTo(sx,sy+s*b,sx+out,sy+s*b,sx+out,sy+s*L*.5);c.bezierCurveTo(sx+out,sy+s*c1,sx,sy+s*c1,sx,sy+s*d)}c.lineTo(sx,sy+len)}}
function makePieces(srcCanvas){const sw=srcCanvas.width,sh=srcCanvas.height,cw=sw/COLS,ch=sh/ROWS,pad=Math.round(Math.min(cw,ch)*.26);const rights=Array.from({length:ROWS},()=>Array(COLS).fill(0)),bottoms=Array.from({length:ROWS},()=>Array(COLS).fill(0));for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(c<COLS-1)rights[r][c]=((r+c)%2?1:-1);if(r<ROWS-1)bottoms[r][c]=((r*COLS+c)%2?1:-1)}pieceDefs=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const top=r? -bottoms[r-1][c]:0,left=c? -rights[r][c-1]:0,right=rights[r][c],bottom=bottoms[r][c];const pc=document.createElement('canvas');pc.width=Math.ceil(cw+pad*2);pc.height=Math.ceil(ch+pad*2);const x=pc.getContext('2d');jigsawPath(x,0,0,cw,ch,pad,top,right,bottom,left);x.clip();x.drawImage(srcCanvas,-c*cw+pad,-r*ch+pad);pieceDefs.push({id:r*COLS+c,row:r,col:c,url:pc.toDataURL('image/webp',.9),pw:pc.width,ph:pc.height,pad,cw,ch})}}
function buildSlots(){slotGrid.innerHTML='';for(let i=0;i<20;i++){const s=document.createElement('div');s.className='slot';slotGrid.appendChild(s)}}
function resetGame(){locked=0;statusEl.textContent='0 / 20';board.querySelectorAll('.piece').forEach(p=>p.remove());tray.innerHTML='';const order=[...pieceDefs].sort(()=>Math.random()-.5);order.forEach(def=>{const cell=document.createElement('div');cell.className='trayCell';const p=document.createElement('img');p.className='piece';p.src=def.url;p.dataset.id=def.id;p.draggable=false;p.addEventListener('pointerdown',startDrag);cell.appendChild(p);tray.appendChild(cell)});showPreview(2000)}
function showPreview(ms=2000){previewOverlay.style.backgroundImage=`url(${sourceURL})`;previewOverlay.classList.add('show');setTimeout(()=>previewOverlay.classList.remove('show'),ms)}
document.getElementById('previewBtn').onclick=()=>showPreview(2000);document.getElementById('restartBtn').onclick=()=>{resetGame();toastMsg('퍼즐을 다시 섞었어요!')};
function startDrag(e){const p=e.currentTarget;if(p.classList.contains('locked'))return;const def=pieceDefs[+p.dataset.id],rect=p.getBoundingClientRect();drag={p,def,originParent:p.parentElement,dx:e.clientX-rect.left,dy:e.clientY-rect.top};tone('move');document.body.appendChild(p);p.classList.add('dragging');p.style.position='fixed';p.style.width=(board.clientWidth/COLS+def.pad*2*(board.clientWidth/(def.cw*COLS)))+'px';p.style.height='auto';p.style.left=(e.clientX-drag.dx)+'px';p.style.top=(e.clientY-drag.dy)+'px';p.setPointerCapture?.(e.pointerId);window.addEventListener('pointermove',moveDrag,{passive:false});window.addEventListener('pointerup',endDrag,{once:true})}
function moveDrag(e){if(!drag)return;e.preventDefault();drag.p.style.left=(e.clientX-drag.dx)+'px';drag.p.style.top=(e.clientY-drag.dy)+'px'}
function endDrag(e){window.removeEventListener('pointermove',moveDrag);if(!drag)return;const {p,def,originParent}=drag,br=board.getBoundingClientRect(),pr=p.getBoundingClientRect(),scale=board.clientWidth/(def.cw*COLS),pad=def.pad*scale,targetX=br.left+def.col*(br.width/COLS)-pad,targetY=br.top+def.row*(br.height/ROWS)-pad;const d=Math.hypot(pr.left-targetX,pr.top-targetY),tol=Math.min(br.width/COLS,br.height/ROWS)*.58;p.classList.remove('dragging');if(d<tol){board.appendChild(p);p.classList.add('locked');p.style.position='absolute';p.style.width=(br.width/COLS+pad*2)+'px';p.style.left=(def.col*(100/COLS)-(pad/br.width*100))+'%';p.style.top=(def.row*(100/ROWS)-(pad/br.height*100))+'%';p.style.height='auto';tone('snap');locked++;statusEl.textContent=locked+' / 20';if(locked===20)setTimeout(()=>toastMsg('완성! 🎉'),250)}else{originParent.appendChild(p);p.style.position='relative';p.style.width='92%';p.style.height='auto';p.style.left='auto';p.style.top='auto'}drag=null}
async function init(){try{const url=await loadArt();art.onload=()=>{URL.revokeObjectURL(url);requestAnimationFrame(()=>prepare())};art.src=url}catch(e){loader.textContent='퍼즐 화면 로딩 오류: '+e.message}}
function prepare(){const nw=art.naturalWidth,nh=art.naturalHeight,sx=Math.round(nw*.035),sy=Math.round(nh*.244),sw=Math.round(nw*.93),sh=Math.round(nh*.326),c=document.createElement('canvas');c.width=sw;c.height=sh;c.getContext('2d').drawImage(art,sx,sy,sw,sh,0,0,sw,sh);sourceURL=c.toDataURL('image/webp',.92);makePieces(c);buildSlots();resetGame();loader.classList.add('hide')}
init();
</script></body></html>
