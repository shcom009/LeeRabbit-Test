<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffe3eb"><title>퍼즐 맞추기 - 이미지 연결</title><style>
:root{--deep:#843448;--gold:#b67838;--pink:#ef5f7c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Arial Rounded MT Bold","Noto Sans KR",Arial,sans-serif;background:#fbe7ed;color:#6e3544}body{display:flex;justify-content:center}.app{width:min(100%,430px);min-height:100vh;background:linear-gradient(#ffe0e9,#fff7f5 45%,#ffedf2);padding-bottom:18px}.top{height:72px;display:grid;grid-template-columns:60px 1fr 60px;align-items:center;padding:8px 10px;background:linear-gradient(#ffd7e2,#ffe8ed);border-bottom:2px solid #efb7c6}.title{text-align:center;margin:0;font-size:26px;font-weight:900;color:#8c3348;text-shadow:0 2px #fff}.iconBtn{width:50px;height:50px;border:0;padding:0;background:transparent}.iconBtn svg{width:50px;height:50px}.tools{margin:12px 14px 0;padding:10px 11px;background:#fffaf9;border:1px solid #efc2cc;border-radius:18px;display:grid;grid-template-columns:1fr 84px;gap:10px;box-shadow:0 4px 12px rgba(128,59,76,.11)}.previewBlock{display:grid;grid-template-columns:94px 1fr;gap:10px;align-items:center}.previewLabel{font-size:16px;font-weight:900;color:#9b4053;margin:0 0 5px 3px}.thumbFrame{width:94px;height:94px;padding:4px;border-radius:12px;background:#fff;border:1px solid #efc7d0;box-shadow:0 3px 8px rgba(104,56,68,.18)}.thumbFrame img{width:100%;height:100%;object-fit:cover;border-radius:9px;display:block}.info strong{display:block;font-size:17px;color:#a8455b;margin-bottom:5px}.info span{display:block;font-size:12.5px;line-height:1.45;color:#8f616d}.counters{display:grid;gap:9px}.counter{height:49px;border:1px solid #ebd1d7;border-radius:12px;background:#fff;box-shadow:0 2px 6px rgba(98,52,63,.12);font-size:20px;font-weight:900;color:#673441}.boardSection{margin:12px 14px 0}.boardShell{padding:5px;border-radius:15px;background:linear-gradient(#d89b5c,#a9662c);box-shadow:0 5px 12px rgba(102,56,64,.2)}.board{position:relative;width:100%;aspect-ratio:5/4;border-radius:10px;overflow:hidden;background:#f7e9ec}.guideImage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.12;pointer-events:none}.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr)}.cell{position:relative;border-right:1px dashed rgba(159,92,107,.38);border-bottom:1px dashed rgba(159,92,107,.38);display:grid;place-items:center;color:#ba8291;font-weight:900;font-size:12px}.cell:nth-child(5n){border-right:0}.cell:nth-child(n+16){border-bottom:0}.cell.active{animation:blink .35s alternate 4}@keyframes blink{from{background:rgba(255,236,97,.18)}to{background:rgba(255,221,56,.55)}}.placedPiece{position:absolute;z-index:5;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(92,55,60,.18))}.instruction{text-align:center;margin:11px 0 8px;color:#dc4f70;font-weight:900;font-size:15px}.trayWrap{position:relative}.tray{height:190px;border:2px dashed #efb6c4;border-radius:18px;background:rgba(255,255,255,.78);padding:10px;overflow-x:auto;overflow-y:hidden;display:grid;grid-template-rows:repeat(2,78px);grid-auto-flow:column;grid-auto-columns:78px;gap:8px;scroll-snap-type:x proximity}.pieceCard{position:relative;width:78px;height:78px;display:grid;place-items:center;scroll-snap-align:start}.pieceCard canvas{width:74px;height:74px;filter:drop-shadow(0 2px 2px rgba(100,55,65,.25));touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.pieceCard.draggingSource canvas{opacity:.28}.num{position:absolute;right:2px;top:2px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#ee5679;color:white;border:2px solid #fff;font-size:11px;font-weight:900;box-shadow:0 1px 3px #a76475;pointer-events:none}.scrollHelp{text-align:center;font-size:11px;color:#a76a79;margin-top:5px}.check{margin:12px 14px 0;padding:9px 12px;border-radius:12px;background:white;border:1px solid #efd0d8;text-align:center;font-size:12px;color:#9b6472;line-height:1.5}.check b{color:#dc5474}.loading{padding:30px;text-align:center;color:#b35f75;font-weight:900}.dragGhost{position:fixed;z-index:99999;width:90px;height:90px;pointer-events:none;filter:drop-shadow(0 8px 8px rgba(78,43,50,.38));transform:scale(1.05)}.status{text-align:center;margin-top:7px;font-size:13px;font-weight:900;color:#a94b62}
</style></head><body><main class="app"><header class="top"><button class="iconBtn" onclick="location.href='./'" aria-label="이전 화면"><svg viewBox="0 0 64 64"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb0b9"/><stop offset="1" stop-color="#e85170"/></linearGradient></defs><rect x="3" y="3" width="58" height="58" rx="16" fill="url(#g1)" stroke="#d94b66" stroke-width="3"/><path d="M38 18 24 32l14 14M25 32h22" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1 class="title">퍼즐 맞추기</h1><button class="iconBtn" aria-label="내 보상함"><svg viewBox="0 0 64 64"><rect x="3" y="3" width="58" height="58" rx="16" fill="#f47790" stroke="#d94b66" stroke-width="3"/><rect x="15" y="28" width="34" height="24" rx="4" fill="#ffcc43" stroke="#ca862a" stroke-width="2"/><rect x="13" y="23" width="38" height="10" rx="4" fill="#ffe16c" stroke="#ca862a" stroke-width="2"/><rect x="29" y="23" width="7" height="29" fill="#e94c72"/></svg></button></header><section class="tools"><div class="previewBlock"><div><div class="previewLabel">미리보기</div><div class="thumbFrame"><img id="thumb" alt="완성 이미지"></div></div><div class="info"><strong>5 × 4 직소퍼즐</strong><span>여자토끼 이미지 연결 확인 단계입니다.</span></div></div><div class="counters"><button class="counter">👁 ×3</button><button class="counter">💡 ×3</button></div></section><section class="boardSection"><div class="boardShell"><div id="board" class="board"><img id="guideImage" class="guideImage" alt=""><div id="grid" class="grid"></div></div></div><div class="instruction">♥ 조각을 올바른 위치로 드래그해보세요! ♥</div><div class="trayWrap"><div id="tray" class="tray"><div class="loading">조각 생성 중…</div></div><div class="scrollHelp">← 좌우로 밀어서 1번부터 20번까지 모두 확인할 수 있습니다 →</div><div id="status" class="status">0 / 20 완성</div></div></section><div class="check"><b>현재 확인 단계</b><br>여자토끼 원본 연결 · 기존 드래그/정답고정/오답복귀 로직 유지</div></main><script>
const COLS=5,ROWS=4,TOTAL=20;let srcImg,pat,placed=0,drag=null;
function jigsawPath(ctx,x,y,w,h,e){const tab=Math.min(w,h)*.22;ctx.beginPath();ctx.moveTo(x,y);edge(ctx,x,y,w,0,e.t,tab);edge(ctx,x+w,y,h,1,e.r,tab);edge(ctx,x+w,y+h,w,2,e.b,tab);edge(ctx,x,y+h,h,3,e.l,tab);ctx.closePath();function edge(c,sx,sy,len,side,type,t){const d=side===0?[1,0]:side===1?[0,1]:side===2?[-1,0]:[0,-1],n=side===0?[0,-1]:side===1?[1,0]:side===2?[0,1]:[-1,0],P=(a,b=0)=>[sx+d[0]*a+n[0]*b,sy+d[1]*a+n[1]*b];if(!type){c.lineTo(...P(len));return}c.lineTo(...P(len*.34));c.bezierCurveTo(...P(len*.39,0),...P(len*.38,type*t*.7),...P(len*.5,type*t*.7));c.bezierCurveTo(...P(len*.62,type*t*.7),...P(len*.61,0),...P(len*.66,0));c.lineTo(...P(len))}}
function patterns(){const a=[];for(let r=0;r<ROWS;r++){a[r]=[];for(let c=0;c<COLS;c++){a[r][c]={t:r?-a[r-1][c].b:0,l:c?-a[r][c-1].r:0,r:c===COLS-1?0:((r+c)%2?1:-1),b:r===ROWS-1?0:((r*COLS+c)%2?1:-1)}}}return a}
function makePiece(i,size=180){const r=Math.floor(i/COLS),c=i%COLS,sw=srcImg.naturalWidth,sh=srcImg.naturalHeight,cw=sw/COLS,ch=sh/ROWS,pad=Math.round(size*.155),inner=size-pad*2,cv=document.createElement('canvas');cv.width=cv.height=size;const x=cv.getContext('2d');jigsawPath(x,pad,pad,inner,inner,pat[r][c]);x.save();x.clip();const scaleX=inner/cw,scaleY=inner/ch;x.drawImage(srcImg,-c*cw*scaleX+pad,-r*ch*scaleY+pad,sw*scaleX,sh*scaleY);x.restore();x.strokeStyle='rgba(120,72,65,.75)';x.lineWidth=Math.max(1,size/90);jigsawPath(x,pad,pad,inner,inner,pat[r][c]);x.stroke();cv.dataset.index=i;return cv}
function build(){const grid=document.getElementById('grid');grid.innerHTML='';for(let i=0;i<TOTAL;i++){const d=document.createElement('div');d.className='cell';d.dataset.index=i;d.textContent=i+1;grid.appendChild(d)}const tray=document.getElementById('tray');tray.innerHTML='';pat=patterns();for(let i=0;i<TOTAL;i++){const card=document.createElement('div');card.className='pieceCard';card.dataset.index=i;const cv=makePiece(i);cv.addEventListener('pointerdown',startDrag,{passive:false});card.appendChild(cv);const n=document.createElement('span');n.className='num';n.textContent=i+1;card.appendChild(n);tray.appendChild(card)}}
function startDrag(e){if(e.button!==undefined&&e.button!==0)return;e.preventDefault();e.stopPropagation();const source=e.currentTarget,index=+source.dataset.index,card=source.parentElement,rect=source.getBoundingClientRect();const ghost=makePiece(index);ghost.className='dragGhost';document.body.appendChild(ghost);drag={pointerId:e.pointerId,index,card,source,ghost,ox:rect.width/2,oy:rect.height/2};card.classList.add('draggingSource');moveDrag(e);try{source.setPointerCapture(e.pointerId)}catch(_){}document.addEventListener('pointermove',moveDrag,{passive:false});document.addEventListener('pointerup',endDrag,{passive:false,once:true});document.addEventListener('pointercancel',cancelDrag,{passive:false,once:true})}
function moveDrag(e){if(!drag||e.pointerId!==drag.pointerId)return;e.preventDefault();drag.ghost.style.left=(e.clientX-drag.ghost.offsetWidth/2)+'px';drag.ghost.style.top=(e.clientY-drag.ghost.offsetHeight/2)+'px'}
function endDrag(e){if(!drag||e.pointerId!==drag.pointerId)return;e.preventDefault();cleanupListeners();const board=document.getElementById('board'),br=board.getBoundingClientRect(),i=drag.index,r=Math.floor(i/COLS),c=i%COLS,cw=br.width/COLS,ch=br.height/ROWS,targetX=br.left+(c+.5)*cw,targetY=br.top+(r+.5)*ch,gr=drag.ghost.getBoundingClientRect(),cx=gr.left+gr.width/2,cy=gr.top+gr.height/2,ok=Math.hypot(cx-targetX,cy-targetY)<Math.min(cw,ch)*.65;if(ok)lockPiece(i);finishDrag()}
function cancelDrag(){cleanupListeners();finishDrag()}
function cleanupListeners(){document.removeEventListener('pointermove',moveDrag);document.removeEventListener('pointerup',endDrag);document.removeEventListener('pointercancel',cancelDrag)}
function finishDrag(){if(!drag)return;drag.card.classList.remove('draggingSource');drag.ghost.remove();drag=null}
function lockPiece(i){const card=drag.card;const board=document.getElementById('board'),br=board.getBoundingClientRect(),r=Math.floor(i/COLS),c=i%COLS,cw=br.width/COLS,ch=br.height/ROWS,size=Math.max(cw,ch)*1.32,pc=makePiece(i,Math.round(size*2));pc.className='placedPiece';pc.style.width=size+'px';pc.style.height=size+'px';pc.style.left=(c*cw-(size-cw)/2)+'px';pc.style.top=(r*ch-(size-ch)/2)+'px';board.appendChild(pc);card.remove();const cell=document.querySelector('.cell[data-index="'+i+'"]');cell.textContent='';cell.classList.add('active');setTimeout(()=>cell.classList.remove('active'),1200);placed++;document.getElementById('status').textContent=placed+' / 20 완성'}
(async()=>{try{const names=['ps0.txt','ps1.txt','ps2.txt','ps3.txt','ps4.txt'];let b='';for(const n of names){const r=await fetch('./assets/'+n+'?v=17',{cache:'no-store'});if(!r.ok)throw Error(n);b+=(await r.text()).trim()}srcImg=new Image();srcImg.onload=()=>{document.getElementById('thumb').src=srcImg.src;document.getElementById('guideImage').src=srcImg.src;build()};srcImg.src='data:image/webp;base64,'+b}catch(e){console.error(e);document.getElementById('tray').innerHTML='<div class="loading">이미지를 불러오지 못했습니다.</div>'}})();
</script></body></html>
