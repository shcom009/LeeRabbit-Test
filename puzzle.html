*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Arial Rounded MT Bold","Noto Sans KR",Arial,sans-serif;background:#fbe7ed;color:var(--ink)}body{display:flex;justify-content:center}.app{width:min(100%,430px);min-height:100vh;background:radial-gradient(circle at 20% 5%,rgba(255,255,255,.85) 0 2px,transparent 3px),linear-gradient(180deg,#ffdfe8 0,#fff8f5 46%,#ffe8ef 100%);padding-bottom:24px;overflow:hidden}.top{height:68px;display:grid;grid-template-columns:58px 1fr 58px;align-items:center;padding:7px 10px;background:linear-gradient(#ffd8e3,#ffe8ec);border-bottom:2px solid #f2b8c7;box-shadow:0 2px 8px rgba(120,48,66,.11)}.title{margin:0;text-align:center;font-size:25px;font-weight:900;color:#8b3449;letter-spacing:-1.3px;text-shadow:0 2px 0 #fff}.iconBtn{width:48px;height:48px;padding:0;border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 2px 2px rgba(127,55,70,.22))}.iconBtn svg{width:48px;height:48px;display:block}.tools{margin:14px 14px 0;padding:12px 12px 13px;background:rgba(255,255,255,.9);border:1px solid #f1c4cf;border-radius:19px;box-shadow:0 4px 12px rgba(135,66,82,.10);display:grid;grid-template-columns:1fr 91px;gap:11px;align-items:center}.previewBlock{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:center}.previewLabel{font-size:16px;font-weight:900;color:#9a4054;margin-bottom:5px}.thumbFrame{width:104px;aspect-ratio:1/1;border-radius:13px;padding:4px;background:linear-gradient(#fff,#ffeef2);border:1px solid #f2c7d1;box-shadow:0 3px 8px rgba(109,56,69,.16)}.thumbFrame img{width:100%;height:100%;object-fit:cover;border-radius:9px;display:block;background:linear-gradient(135deg,#cfefff,#ffe0e7,#e4f2cb)}.info strong{display:block;color:#a8475d;font-size:17px;margin-bottom:7px;line-height:1.2}.info span{display:block;color:#8a5d69;font-size:12.5px;line-height:1.48}.counters{display:grid;gap:10px}.counter{height:51px;border:1px solid #ecd1d8;border-radius:13px;background:linear-gradient(#fff,#fffafa);box-shadow:0 2px 6px rgba(104,56,67,.10);font-size:20px;font-weight:900;color:#693643;display:flex;align-items:center;justify-content:center;gap:5px}.eyeIcon,.bulbIcon{width:24px;height:24px;display:block}.boardSection{margin:14px 14px 0}.board{position:relative;width:100%;aspect-ratio:5/4;border:5px solid #b8793c;border-radius:15px;background:linear-gradient(135deg,#fff9f8,#f4e7eb);box-shadow:0 4px 10px rgba(102,57,66,.20),inset 0 0 0 2px rgba(255,255,255,.45);overflow:hidden}.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr)}.cell{border-right:1px dashed rgba(175,111,126,.25);border-bottom:1px dashed rgba(175,111,126,.25);display:grid;place-items:center;color:rgba(160,100,114,.22);font-size:12px;font-weight:800}.cell:nth-child(5n){border-right:0}.cell:nth-child(n+16){border-bottom:0}.boardText{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.boardText div{text-align:center;color:#c98b9b;font-weight:900;line-height:1.55;text-shadow:0 1px 0 #fff}.instruction{text-align:center;margin:12px 0 9px;color:#de4c70;font-size:15px;font-weight:900}.tray{min-height:184px;padding:16px 12px;border:2px dashed #efb4c3;border-radius:18px;background:rgba(255,255,255,.73);display:grid;place-items:center;box-shadow:inset 0 0 0 4px rgba(255,255,255,.3)}.trayInner{text-align:center;color:#bd7c8d}.trayPieces{display:flex;justify-content:center;gap:14px;margin-bottom:10px}.puzzleSvg{width:45px;height:45px;filter:drop-shadow(0 2px 1px rgba(104,54,66,.12))}.trayInner strong{display:block;color:#a95d72;font-size:15px}.trayInner small{display:block;margin-top:6px;font-size:12px;line-height:1.5}.devNote{margin:15px 14px 0;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #efd2d9;color:#a66b79;text-align:center;font-size:11.5px;line-height:1.55}.devNote b{color:#dd5374}
