<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fde8ee">
<title>퍼즐 맞추기</title>
<style>
:root{--pink:#f45b83;--deep:#9a394e;--paper:#fff8f8;--line:#f5c7d2;--orange:#ff9f18}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans KR",sans-serif;background:#fde8ee;color:#63323d}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100vh;background:linear-gradient(#ffe6ec,#fff9f8);padding-bottom:24px;overflow:hidden}.top{height:64px;display:grid;grid-template-columns:58px 1fr 58px;align-items:center;padding:7px 10px;border-bottom:2px solid #f7ccd5;background:#ffdce6}.top h1{font-size:22px;text-align:center;margin:0;color:#8f394c}.iconbtn{width:46px;height:46px;border:0;border-radius:13px;background:linear-gradient(#ff8e9e,#f45f78);box-shadow:inset 0 0 0 2px #e5546c,0 2px 3px #eab6c1;color:#fff;font-size:25px;font-weight:900;cursor:pointer}.gift{font-size:24px}.panel{margin:12px 14px 0;background:rgba(255,255,255,.76);border:1px solid #f5ccd5;border-radius:20px;padding:12px}.tools{display:grid;grid-template-columns:1fr 92px;gap:12px;align-items:center}.previewbox{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center}.thumbWrap{position:relative}.thumbLabel{font-weight:900;color:#9b4053;margin-bottom:5px}.thumb{width:92px;height:74px;border:3px solid #fff;border-radius:10px;object-fit:cover;background:#f2dfe3;box-shadow:0 2px 6px #d6aeba;cursor:pointer}.counters{display:grid;gap:9px}.counter{height:48px;border:1px solid #ecd5da;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;box-shadow:0 2px 5px #ead6dc;cursor:pointer}.boardWrap{margin:12px 14px 0}.board{position:relative;width:100%;aspect-ratio:5/4;background:#f0dce1;border:5px solid #b57945;border-radius:14px;overflow:visible;box-shadow:0 3px 8px rgba(116,64,72,.18)}.boardGuide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.17;border-radius:8px;pointer-events:none}.cell{position:absolute;border:1px dashed rgba(150,94,102,.25);pointer-events:none}.placed{position:absolute;pointer-events:none;z-index:4}.instruction{text-align:center;margin:12px 0 7px;color:#d84f72;font-weight:900;font-size:15px}.tray{margin:0 12px;padding:8px 6px 13px;min-height:205px;border-radius:17px;background:#fff6f7;border:1px solid #f7cbd5;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start}.pieceSlot{height:76px;display:grid;place-items:center}.piece{width:70px;height:70px;touch-action:none;cursor:grab;filter:drop-shadow(0 2px 2px rgba(96,49,58,.28));user-select:none;-webkit-user-select:none}.piece.dragging{position:fixed;z-index:1000;pointer-events:none;cursor:grabbing;transform:scale(1.1);filter:drop-shadow(0 7px 7px rgba(80,35,45,.35))}.status{text-align:center;color:#a4475c;font-weight:900;margin-top:4px}.overlay{position:fixed;inset:0;background:rgba(66,25,36,.42);z-index:2000;display:none;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.previewCard{width:min(92vw,420px);background:#fff6f8;border-radius:22px;padding:12px;border:2px solid #ffc7d4;box-shadow:0 18px 50px rgba(70,25,37,.25)}.previewCard img{display:block;width:100%;border-radius:14px}.msg{font-size:26px;font-weight:900;color:#e94d76;text-align:center;padding:22px}.hintFlash{animation:flash .35s alternate 6}@keyframes flash{from{box-shadow:inset 0 0 0 3px #ffd541,0 0 6px #ffd541}to{box-shadow:inset 0 0 0 6px #fff09a,0 0 24px #ffd541}}.shake{animation:shake .12s alternate 12}@keyframes shake{from{transform:translateX(-5px) rotate(-4deg)}to{transform:translateX(5px) rotate(4deg)}}
</style>
</head>
<body>
<main class="app">
<header class="top"><button class="iconbtn" id="backBtn" aria-label="이전 화면">←</button><h1>퍼즐 맞추기</h1><button class="iconbtn gift" id="rewardBtn" aria-label="내 보상함">🎁</button></header>
<section class="panel tools"><div class="previewbox"><div class="thumbWrap"><div class="thumbLabel">미리보기</div><img id="thumb" class="thumb" alt="완성 이미지 미리보기"></div><div><div style="font-weight:900;color:#b34a61">5 × 4 직소퍼즐</div><div class="status" id="status">0 / 20 완성</div></div></div><div class="counters"><button class="counter" id="previewBtn">👁 ×3</button><button class="counter" id="hintBtn">💡 ×3</button></div></section>
<section class="boardWrap"><div id="board" class="board"><img id="guide" class="boardGuide" alt=""></div><div class="instruction">♥ 아래 조각을 드래그해서 맞춰보세요! ♥</div><div id="tray" class="tray"></div></section>
</main>
<div id="previewOverlay" class="overlay"><div class="previewCard"><img id="bigPreview" alt="완성 이미지"></div></div>
<div id="messageOverlay" class="overlay"><div class="previewCard"><div id="message" class="msg"></div></div></div>
<script>
const COLS=5,ROWS=4,TOTAL=20;
const board=document.getElementById('board'),tray=document.getElementById('tray'),statusEl=document.getElementById('status');
const previewOverlay=document.getElementById('previewOverlay'),messageOverlay=document.getElementById('messageOverlay'),message=document.getElementById('message');
let sourceImg=null,placed=0,drag=null,previewLeft=3,hintLeft=3;
const edgePattern=[];
for(let r=0;r<ROWS;r++){edgePattern[r]=[];for(let c=0;c<COLS;c++){edgePattern[r][c]={top:r===0?0:-edgePattern[r-1][c].bottom,left:c===0?0:-edgePattern[r][c-1].right,right:c===COLS-1?0:((r+c)%2?1:-1),bottom:r===ROWS-1?0:((r*COLS+c)%3?1:-1)}}}
function showMsg(t,ms=1400){message.textContent=t;messageOverlay.classList.add('show');setTimeout(()=>messageOverlay.classList.remove('show'),ms)}
function getCropFromMockup(){return new Promise(async(resolve,reject)=>{try{const names=['pv0.txt','pv1.txt','pv2.txt'];let b='';for(const n of names){const rr=await fetch('./assets/'+n+'?v=10',{cache:'no-store'});if(!rr.ok)throw Error(n);b+=(await rr.text()).trim()}const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');/* approved mockup board region; values normalized to its natural size */const sx=Math.round(im.naturalWidth*.035),sy=Math.round(im.naturalHeight*.306),sw=Math.round(im.naturalWidth*.925),sh=Math.round(im.naturalHeight*.370);cv.width=1000;cv.height=800;cv.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,1000,800);const out=new Image();out.onload=()=>resolve(out);out.onerror=reject;out.src=cv.toDataURL('image/jpeg',.94)};im.onerror=reject;im.src='data:image/webp;base64,'+b}catch(e){reject(e)}})}
function pathPiece(ctx,x,y,w,h,e,m){const t=Math.min(w,h)*.26;ctx.beginPath();ctx.moveTo(x,y);edge(ctx,x,y,w,0,e.top,t);edge(ctx,x+w,y,h,1,e.right,t);edge(ctx,x+w,y+h,w,2,e.bottom,t);edge(ctx,x,y+h,h,3,e.left,t);ctx.closePath()}
function edge(ctx,x,y,len,side,type,t){const dir=side===0?[1,0]:side===1?[0,1]:side===2?[-1,0]:[0,-1];const norm=side===0?[0,-1]:side===1?[1,0]:side===2?[0,1]:[-1,0];const sx=x,sy=y;const p=(d,n=0)=>[sx+dir[0]*d+norm[0]*n,sy+dir[1]*d+norm[1]*n];if(!type){const q=p(len);ctx.lineTo(...q);return}ctx.lineTo(...p(len*.34));const sign=type;let q=p(len*.40,sign*t*.08);ctx.bezierCurveTo(...p(len*.35,sign*t*.05),...p(len*.37,sign*t*.48),...q);ctx.bezierCurveTo(...p(len*.43,sign*t*.78),...p(len*.57,sign*t*.78),...p(len*.60,sign*t*.08));ctx.bezierCurveTo(...p(len*.63,sign*t*.48),...p(len*.65,sign*t*.05),...p(len*.66));ctx.lineTo(...p(len))}
function renderPiece(index,size=86){const r=Math.floor(index/COLS),c=index%COLS,e=edgePattern[r][c],cellW=sourceImg.naturalWidth/COLS,cellH=sourceImg.naturalHeight/ROWS,m=size*.14,inner=size-2*m,cv=document.createElement('canvas');cv.width=cv.height=size;const ctx=cv.getContext('2d');ctx.save();pathPiece(ctx,m,m,inner,inner,e,m);ctx.clip();const scaleX=inner/cellW,scaleY=inner/cellH;ctx.drawImage(sourceImg,-c*cellW*scaleX+m,-r*cellH*scaleY+m,sourceImg.naturalWidth*scaleX,sourceImg.naturalHeight*scaleY);ctx.restore();ctx.strokeStyle='rgba(130,80,70,.65)';ctx.lineWidth=1.2;pathPiece(ctx,m,m,inner,inner,e,m);ctx.stroke();cv.className='piece';cv.dataset.index=index;cv.addEventListener('pointerdown',startDrag);return cv}
function build(){tray.innerHTML='';board.querySelectorAll('.placed,.cell').forEach(e=>e.remove());placed=0;statusEl.textContent='0 / 20 완성';const order=[...Array(TOTAL).keys()].sort(()=>Math.random()-.5);order.forEach(i=>{const slot=document.createElement('div');slot.className='pieceSlot';slot.dataset.index=i;slot.appendChild(renderPiece(i,72));tray.appendChild(slot)});drawCells();document.getElementById('guide').src=sourceImg.src;document.getElementById('thumb').src=sourceImg.src;document.getElementById('bigPreview').src=sourceImg.src;showPreview(2000)}
function drawCells(){const bw=board.clientWidth,bh=board.clientHeight,cw=bw/COLS,ch=bh/ROWS;for(let i=0;i<TOTAL;i++){const r=Math.floor(i/COLS),c=i%COLS,d=document.createElement('div');d.className='cell';d.dataset.index=i;Object.assign(d.style,{left:c*cw+'px',top:r*ch+'px',width:cw+'px',height:ch+'px'});board.appendChild(d)}}
function startDrag(ev){ev.preventDefault();const el=ev.currentTarget,rect=el.getBoundingClientRect();drag={el,index:+el.dataset.index,ox:ev.clientX-rect.left,oy:ev.clientY-rect.top,slot:el.parentElement};el.classList.add('dragging');document.body.appendChild(el);moveDrag(ev);el.setPointerCapture?.(ev.pointerId);window.addEventListener('pointermove',moveDrag,{passive:false});window.addEventListener('pointerup',endDrag,{once:true})}
function moveDrag(ev){if(!drag)return;ev.preventDefault();drag.el.style.left=(ev.clientX-drag.ox)+'px';drag.el.style.top=(ev.clientY-drag.oy)+'px'}
function endDrag(ev){window.removeEventListener('pointermove',moveDrag);if(!drag)return;const br=board.getBoundingClientRect(),i=drag.index,r=Math.floor(i/COLS),c=i%COLS,cw=br.width/COLS,ch=br.height/ROWS,targetX=br.left+(c+.5)*cw,targetY=br.top+(r+.5)*ch,pr=drag.el.getBoundingClientRect(),cx=pr.left+pr.width/2,cy=pr.top+pr.height/2,ok=Math.hypot(cx-targetX,cy-targetY)<Math.min(cw,ch)*.58;if(ok)placePiece(i);else{returnToTray()}drag=null}
function returnToTray(){const el=drag.el;el.classList.remove('dragging');el.style.cssText='';drag.slot.appendChild(el)}
function placePiece(i){const old=drag.el;old.remove();drag.slot.remove();const r=Math.floor(i/COLS),c=i%COLS,bw=board.clientWidth,bh=board.clientHeight,cw=bw/COLS,ch=bh/ROWS,size=Math.max(cw,ch)*1.28,pc=renderPiece(i,Math.round(size));pc.className='placed';pc.style.width=size+'px';pc.style.height=size+'px';pc.style.left=(c*cw-(size-cw)/2)+'px';pc.style.top=(r*ch-(size-ch)/2)+'px';board.appendChild(pc);placed++;statusEl.textContent=placed+' / 20 완성';if(placed===TOTAL)setTimeout(()=>showMsg('완성! 🎉',2200),300)}
function showPreview(ms=2000){previewOverlay.classList.add('show');setTimeout(()=>previewOverlay.classList.remove('show'),ms)}
document.getElementById('previewBtn').onclick=()=>{if(previewLeft<=0)return showMsg('3번까지만 볼 수 있지롱~');previewLeft--;document.getElementById('previewBtn').textContent='👁 ×'+previewLeft;showPreview()};document.getElementById('thumb').onclick=()=>document.getElementById('previewBtn').click();
document.getElementById('hintBtn').onclick=()=>{if(hintLeft<=0)return showMsg('3번까지만 볼 수 있지롱~');const pieces=[...tray.querySelectorAll('.piece')];if(!pieces.length)return;hintLeft--;document.getElementById('hintBtn').textContent='💡 ×'+hintLeft;const p=pieces[Math.floor(Math.random()*pieces.length)],i=+p.dataset.index,cell=board.querySelector('.cell[data-index="'+i+'"]');p.classList.add('shake');cell.classList.add('hintFlash');setTimeout(()=>{p.classList.remove('shake');cell.classList.remove('hintFlash')},2000)};
document.getElementById('backBtn').onclick=()=>location.href='./';document.getElementById('rewardBtn').onclick=()=>showMsg('내 보상함 연결은 핵심 퍼즐 확인 후 다음 단계에서 붙일게요.',1800);
(async()=>{try{sourceImg=await getCropFromMockup();build()}catch(e){console.error(e);showMsg('퍼즐 이미지를 불러오지 못했어요.',3000)}})();
</script>
</body></html>
