<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fde9ee">
<title>퍼즐 맞추기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fde9ee;font-family:Arial,"Noto Sans KR",sans-serif}body{display:flex;justify-content:center}.screen{position:relative;width:min(100vw,430px);min-height:100vh;background:#fde9ee;overflow:hidden}.art{display:block;width:100%;height:auto}.loader{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#fde9ee;color:#d84b70;font-weight:900;text-align:center;padding:24px}.loader.hide{display:none}.hotspot{position:absolute;display:block;z-index:5;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.back{left:4.7%;top:2%;width:11.5%;height:5%}.gift{right:4.5%;top:2%;width:11.5%;height:5%}.preview{left:57.5%;top:11%;width:23%;height:5.2%}.hint{left:57.5%;top:17.1%;width:23%;height:5.2%}.restart{left:3.7%;top:91.1%;width:32.8%;height:5.2%}.hintBottom{right:3.7%;top:91.1%;width:32.8%;height:5.2%}.hotspot:focus-visible{outline:3px solid #ff4d82;outline-offset:2px;border-radius:14px}.toast{position:fixed;left:50%;bottom:26px;z-index:30;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:rgba(77,30,43,.92);color:#fff;padding:11px 18px;border-radius:999px;font-weight:800;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main class="screen">
<div class="loader" id="loader">퍼즐 화면을 불러오는 중… 🐰</div>
<img id="puzzleArt" class="art" alt="퍼즐 맞추기 화면">
<a class="hotspot back" href="./" aria-label="게임 목록으로">목록</a>
<button class="hotspot gift" type="button" data-msg="내 보상함은 다음 기능 연결 단계에서 작동해요.">보상함</button>
<button class="hotspot preview" type="button" data-msg="미리보기 기능은 퍼즐 동작 구현 단계에서 연결해요.">미리보기</button>
<button class="hotspot hint" type="button" data-msg="힌트 기능은 퍼즐 동작 구현 단계에서 연결해요.">힌트</button>
<button class="hotspot restart" type="button" data-msg="다시 시작 기능은 퍼즐 동작 구현 단계에서 연결해요.">다시 시작</button>
<button class="hotspot hintBottom" type="button" data-msg="힌트 기능은 퍼즐 동작 구현 단계에서 연결해요.">힌트</button>
</main>
<div class="toast" id="toast"></div>
<script>
async function loadPuzzleArt(){
 const loader=document.getElementById('loader'),img=document.getElementById('puzzleArt');
 try{
  const parts=await Promise.all([0,1,2].map(i=>fetch(`assets/pv${i}.txt?v=7`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('asset');return r.text()})));
  img.onload=()=>loader.classList.add('hide');
  img.onerror=()=>{loader.textContent='퍼즐 이미지를 불러오지 못했어요. 새로고침해 주세요.'};
  img.src='data:image/webp;base64,'+parts.join('');
 }catch(e){loader.textContent='퍼즐 화면을 불러오지 못했어요. 새로고침해 주세요.'}
}
loadPuzzleArt();
const toast=document.getElementById('toast');let timer;document.querySelectorAll('[data-msg]').forEach(b=>b.addEventListener('click',()=>{toast.textContent=b.dataset.msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1600)}));
</script>
</body>
</html>
